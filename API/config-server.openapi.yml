openapi: 3.2.1
info:
  title: Config Server API
  version: 1.0.0
  description: API para la configuración centralizada de microservicios.
paths:
  /{application}/{profile}:
    get:
      summary: Obtener configuración de la aplicación
      parameters:
        - name: application
          in: path
          required: true
          schema:
            type: string
        - name: profile
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Configuración obtenida exitosamente.
        '404':
          description: Aplicación o perfil no encontrado.
  /encrypt:
    post:
      summary: Cifrar un valor
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Valor cifrado exitosamente.
        '400':
          description: Error en datos de entrada.
  /decrypt:
    post:
      summary: Descifrar un valor cifrado
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: Valor descifrado exitosamente.
        '400':
          description: Error en datos de entrada o clave incorrecta.
