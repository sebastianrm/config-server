server:
  port: ${SERVER_PORT:8888}
spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_PROFILE:git}
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:file:///config-repo}
          search-paths: ${CONFIG_GIT_SEARCH_PATHS:.}
          default-label: main
          force-pull: false
        health:
          enabled: true
    discovery:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-service:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
logging:
  level:
    com.yanki: INFO
